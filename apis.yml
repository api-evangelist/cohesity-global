description: Cohesity is an AI-powered data security and management company whose platform consolidates
  backup and recovery, cyber resilience, threat defense, and data insights across cloud, on-premises,
  and SaaS environments. Cohesity exposes RESTful Helios and Cluster APIs alongside first-party Python,
  Go, PowerShell, Ansible, and Terraform tooling so developers can automate data protection, orchestrate
  recovery, run reporting, and build custom workflows against 1,000+ supported workloads. Originally
  surfaced as a portfolio company of Battery Ventures and enriched from Cohesity's public developer
  surface.
